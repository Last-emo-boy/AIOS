[package]
name = "agentd_init"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# 真实 PID1 / init（ADR-004 D3.2 / D5 / cp4）。
# cp4 成熟后产出的 static-musl 二进制将取代 image/ 下生成的 /sbin/agentd 占位 ELF。
[dependencies]
platform_sys = { path = "../platform_sys" }
agent_runtime = { path = "../agent_runtime" }

# disk_init bin（cp7）运行时重算 runtime-manifest SHA-256（反假绿）。lock 已有 0.10.9
# （runtime_contracts/agent_core），零新 lock churn。
sha2 = "0.10"
