[workspace]
members = [
    "crates/agentd",
    "crates/runtime_contracts",
    "crates/security_execution",
    "crates/agent_core",
    # ADR-004 真实执行底座（新建，旧 crate 冻结为 oracle）
    "crates/platform_sys",
    "crates/agent_runtime",
    "crates/agentd_init",
    "crates/security_execution_linux",
    "crates/early_init",
    # ADR-006 真 LLM 接入（阶段 A+B）：provider 抽象 + LLM 输出经冻结控制面约束。
    "crates/llm_planner",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "UNLICENSED"
