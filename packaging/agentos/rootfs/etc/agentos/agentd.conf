# agentd 发行版配置（纯 std KV 格式：key = value，# 注释）。
# 优先级：环境变量 > 本文件 > 缺省。
# 详见 crates/agentd/src/config.rs。

# 运行模式：local-only（最小权限，绑定 loopback）。
run_mode = local-only

# 规划器模式：stub（固定计划，向后兼容）| real（接入 llm_planner）。
planner_mode = stub

# HTTP 监听地址（建议 loopback，发行版不对外暴露）。
http_addr = 127.0.0.1:8421

# 审计日志落盘路径（append-only JSONL，真相源）。
audit_path = /var/log/agentos/audit/agentd.jsonl

# 是否允许任意 shell（发行版默认 false——shell.exec 被裁决为 Never）。
arbitrary_shell_enabled = false

# run loop 最大重规划次数（advisory，运行时裁剪）。
max_replans = 3
