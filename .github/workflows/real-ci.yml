# ADR-004 D4 / cp0：真实 Linux + KVM CI，取代 Windows/PowerShell 投影证据。
name: real-ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build + test (host target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo build
        run: cargo build --workspace
      - name: cargo test
        run: cargo test --workspace

  musl-appliance:
    name: static-musl agentd_init (cp2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: install musl tools + static-analysis utils
        run: sudo apt-get update && sudo apt-get install -y musl-tools file binutils
      - name: build static agentd_init + probes (all bins)
        run: cargo build -p agentd_init --target x86_64-unknown-linux-musl --release --bins
      - name: assert fully static (triple-check, static-pie safe)
        run: |
          f=target/x86_64-unknown-linux-musl/release/agentd_init
          file "$f"
          # musl 默认产 static-pie：带 .dynamic 段做自重定位，但无 INTERP/NEEDED。故不能用
          # 'readelf -d 有 Dynamic 段=动态'（会误杀 static-pie）。三重判据如下。
          if ldd "$f" 2>&1 | grep -q "=>"; then echo "ERROR: dynamically linked"; exit 1; fi
          if [ "$(readelf -l "$f" | grep -c INTERP)" != 0 ]; then echo "ERROR: has INTERP"; exit 1; fi
          if [ "$(readelf -d "$f" 2>/dev/null | grep -c NEEDED)" != 0 ]; then echo "ERROR: has NEEDED"; exit 1; fi
          echo "OK: fully static (no =>, no INTERP, no NEEDED)"
      - name: run static probes (cp2 de-risk：musl 下搬运的 syscall 真能跑)
        run: |
          # probe 退出 0 = unshare/mount(/proc,/sys)/no_new_privs/signalfd/fork/reap/run loop 在
          # musl 静态二进制里真跑通（ubuntu-latest 允许 unprivileged userns，同 build-test 前提）。
          D=target/x86_64-unknown-linux-musl/release
          "$D/init_probe" || { echo "ERROR: init_probe failed"; exit 1; }
          "$D/boot_probe" || { echo "ERROR: boot_probe failed"; exit 1; }
          echo "OK: init_probe + boot_probe both exited 0 (musl static, real syscalls)"

  tcg-boot:
    name: real TCG boot to PID1 (no kvm, machine-verified poweroff, cp4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: install qemu + musl + cpio + file
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 musl-tools cpio gzip file
      - name: build static boot_smoke (/init)
        run: cargo build -p agentd_init --bin boot_smoke --target x86_64-unknown-linux-musl --release
      - name: provide readable kernel
        # 标准 runner 的 /boot 内核 root-only；复制到可读路径供 QEMU -kernel（无需 /dev/kvm，TCG）。
        run: sudo cp "/boot/vmlinuz-$(uname -r)" /tmp/vmlinuz && sudo chmod a+r /tmp/vmlinuz
      - name: real boot + assert runtime-derived READY marker
        env:
          AIOS_QEMU_REQUIRED: '1'        # 缺工具/内核=硬 FAIL，杜绝静默 skip-green
          AIOS_QEMU_KERNEL: /tmp/vmlinuz
        run: |
          export AIOS_AGENTD_INIT_MUSL="$PWD/target/x86_64-unknown-linux-musl/release/boot_smoke"
          cargo test -p agentd_init --test real_qemu_boot -- --ignored --nocapture

  tcg-disk-boot:
    name: real TCG disk-boot pivot to ext4 root (no kvm, cp7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: install qemu + disk/grub/fs tools + musl
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 gdisk grub-pc-bin e2fsprogs util-linux kmod musl-tools cpio gzip file
      - name: build static early_init + disk_init
        run: |
          cargo build -p early_init --bin early_init --target x86_64-unknown-linux-musl --release
          cargo build -p agentd_init --bin disk_init --target x86_64-unknown-linux-musl --release
      - name: build bootable disk image (full pivot)
        run: |
          KREL="$(uname -r)"
          # builtin ext4/virtio_blk（CONFIG=y）→ early_init 无需模块（Path B，MODS 空）；模块化内核
          # 需对应 .ko.xz（本机 Debian 形态）。其它压缩格式（如 Ubuntu .ko.zst）留作 open（见 ADR 注脚）；
          # 此时 job 真失败而非假绿，待 CI dry-run 确认 runner 内核形态后调整。
          if grep -q "CONFIG_EXT4_FS=y" "/boot/config-$KREL" && grep -q "CONFIG_VIRTIO_BLK=y" "/boot/config-$KREL"; then
            MODS=""
          else
            MODS="virtio_blk crc16 crc32c_generic mbcache jbd2 ext4"
          fi
          sudo MODS="$MODS" KERNEL="/boot/vmlinuz-$KREL" bash appliance/build-disk-image.sh
      - name: real disk-boot + assert pivot to ext4 root
        env:
          AIOS_QEMU_REQUIRED: '1'   # 缺工具/镜像=硬 FAIL，杜绝静默 skip-green
        run: |
          export AIOS_DISK_IMAGE="$PWD/appliance/disk.img"
          export AIOS_DISK_MANIFEST_SHA="$(cat "$PWD/appliance/disk.img.manifest.sha256")"
          cargo test -p agentd_init --test real_qemu_disk_boot -- --ignored --nocapture

  tcg-cp8-recovery:
    name: real TCG cp8 persist + crash recovery (no kvm, cp8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: install qemu + disk/grub/fs tools + musl
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 gdisk grub-pc-bin e2fsprogs util-linux kmod musl-tools cpio gzip file
      - name: build static early_init + disk_init
        run: |
          cargo build -p early_init --bin early_init --target x86_64-unknown-linux-musl --release
          cargo build -p agentd_init --bin disk_init --target x86_64-unknown-linux-musl --release
      - name: build bootable disk image (full pivot)
        run: |
          KREL="$(uname -r)"
          if grep -q "CONFIG_EXT4_FS=y" "/boot/config-$KREL" && grep -q "CONFIG_VIRTIO_BLK=y" "/boot/config-$KREL"; then
            MODS=""
          else
            MODS="virtio_blk crc16 crc32c_generic mbcache jbd2 ext4"
          fi
          sudo MODS="$MODS" KERNEL="/boot/vmlinuz-$KREL" bash appliance/build-disk-image.sh
      - name: cp8 3-boot persist + crash recovery（须 root：losetup/mount seed + host 复核）
        # 直接 sudo bash 脚本（须 root 的 losetup；避免 sudo cargo 的 PATH 问题）。脚本内 3 次 TCG boot
        # + 真崩溃注入 + 真回滚 + host loop-mount 独立复核；任一断言失败/超时即 FAIL，杜绝假绿。
        run: sudo bash appliance/cp8-recovery-smoke.sh "$PWD/appliance/disk.img"

  # cp5：真实内核强制 + 逃逸 harness。需要暴露 /dev/kvm 的 self-hosted runner
  # （GitHub 标准 runner 不提供 /dev/kvm）。在该 runner 就绪前保持禁用，
  # 避免在无 KVM 的标准 runner 上产生虚假绿灯（ADR-004 D5）。
  kvm-enforcement:
    name: real sandbox + escape harness (cp5, needs /dev/kvm)
    if: ${{ false }}
    runs-on: [self-hosted, kvm]
    steps:
      - uses: actions/checkout@v4
      - name: real-kernel escape harness
        run: echo "TODO(cp5): boot pinned kernel under QEMU/KVM, apply sandbox, run real escape attempts"
