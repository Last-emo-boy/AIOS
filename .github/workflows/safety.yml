name: safety

on:
  push:
  pull_request:

jobs:
  agentd-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run safety regression gate
        run: 'cargo test -p agentd safety::'
      - name: Run AgentCore adversarial runtime gate
        run: cargo test -p agentd agent_core::adversarial
