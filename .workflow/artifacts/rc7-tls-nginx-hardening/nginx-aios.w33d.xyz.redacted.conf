server {
    listen 80;
    listen [::]:80;
    server_name aios.w33d.xyz;

    root /srv/aios-mirror;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/aios.access.log;
    error_log /var/log/nginx/aios.error.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-AIOS-Mirror "rc7-tls-metadata-only" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location = / {
        default_type text/html;
        try_files /index.html =404;
        limit_except GET HEAD { deny all; }
    }

    location = /index.html {
        default_type text/html;
        try_files /index.html =404;
        limit_except GET HEAD { deny all; }
    }

    location /assets/ {
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location = /health.json {
        default_type application/json;
        try_files /health.json =404;
        limit_except GET HEAD { deny all; }
    }

    location = /.well-known/aios/mirror.json {
        default_type application/json;
        try_files /.well-known/aios/mirror.json =404;
        limit_except GET HEAD { deny all; }
    }

    location /channel/ {
        default_type application/json;
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location /bootstrap/ {
        default_type application/json;
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location /install/ {
        default_type application/json;
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location /payloads/ {
        default_type application/json;
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location /support/ {
        default_type application/json;
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location /releases/ {
        default_type text/plain;
        autoindex off;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location / {
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aios.w33d.xyz;

    root /srv/aios-mirror;
    index index.html;
    autoindex off;
    server_tokens off;
    client_max_body_size 1m;
    access_log /var/log/nginx/aios.access.log;
    error_log /var/log/nginx/aios.error.log warn;

    ssl_certificate /etc/letsencrypt/live/aios.w33d.xyz/fullchain.pem;
    ssl_certificate_key <managed-by-letsencrypt>;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AIOSSSL:10m;
    ssl_session_timeout 1d;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
